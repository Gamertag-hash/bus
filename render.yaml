services:
  - type: web
    name: bus-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bus-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@schoolbus.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        value: https://bus-zeta-flame.vercel.app

databases:
  - name: bus-postgres
    engine: postgres
    version: '15'
    plan: free

